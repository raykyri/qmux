[package]
name = "qmux-cli"
version = "0.3.3"
description = "The qmux in-pane CLI: hook notifies, cwd reporting, forks, and agent supervision."
license = "MIT"
edition = "2024"

[[bin]]
name = "qmux-cli"
path = "src/bin/qmux-cli.rs"

[dependencies]
dirs = "6"
libc = "0.2"
qmux-proto = { path = "../qmux-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
