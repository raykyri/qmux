[workspace]
members = ["crates/qmux-proto", "crates/qmux-cli"]

[package]
name = "qmux"
version = "0.3.2"
description = "A multiplexing terminal."
authors = ["Raymond Zhong"]
license = "MIT"
edition = "2024"

[[bin]]
name = "qmux"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Shipping builds were using cargo's stock release profile. Thin LTO and a
# single codegen unit recover the cross-crate inlining a Tauri-sized dependency
# tree otherwise leaves behind, and stripping symbols meaningfully shrinks the
# binary the app (and every in-shell `qmux` CLI fork) must page in at launch.
# panic stays "unwind" deliberately: lock-poisoning recovery in the state and
# persistence paths assumes a stray panic doesn't take the whole app (and every
# live PTY) down with it.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
dirs = "6.0.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.2"
libc = "0.2"
# Backend HTTP for the OpenRouter title proxy so the API key never enters the
# webview. `default-features = false` + `json` keeps this additive to the reqwest
# (rustls) build already pulled in transitively by tauri-plugin-updater.
reqwest = { version = "0.13", default-features = false, features = ["form", "json"] }
regex = "1"
# The updater intentionally enables reqwest's provider-neutral rustls feature.
# Select one provider for every reqwest client in the process; otherwise client
# construction panics before either publishing or title generation can connect.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
names = { version = "0.14", default-features = false }
portable-pty = "0.9"
qmux-cli = { path = "crates/qmux-cli" }
qmux-proto = { path = "crates/qmux-proto" }
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Child webviews currently live behind Tauri's unstable API. Keep the dependency
# on the 2.11 minor while qmux also reaches the platform WKWebView handle for its
# native shortcut bridge; that handle is explicitly allowed to change between
# Tauri minor releases.
tauri = { version = "~2.11.3", features = ["macos-private-api", "tray-icon", "unstable"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
window-vibrancy = "0.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
mac-usernotifications = "0.3.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSCoder",
    "NSDictionary",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSRange",
    "NSString",
    "NSTextCheckingResult",
    "NSThread",
    "objc2-core-foundation",
] }

# Wry 0.55.1 lets a Rust panic escape its Objective-C WKURLSchemeHandler
# callbacks, which turns a recoverable custom-protocol failure into SIGABRT.
# Keep the locked version local until the boundary hardening is upstream.
# See vendor/VENDOR-WRY.md for the upstream base commit, the list of local
# modifications, and the verification script (scripts/verify-vendor-wry.sh).
[patch.crates-io]
wry = { path = "vendor/wry" }
